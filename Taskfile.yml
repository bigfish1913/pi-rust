# Taskfile for the rpi-* crate family release.
#
# The release.ps1 / release.sh scripts were removed (commit 2e5fe54); the
# dep-ordered publish is now driven directly by the targets below via plain
# `cargo publish`. Keep this file as the ergonomic entry point so the
# dependency order is encoded once and `cargo test` stays the pre-flight.
#
# Dependency order (v0.1.4+): telemetry → ai → agent → plugin-sdk →
# extensions → tools → harness → tui → cli. plugin-sdk is a zero-dep leaf
# and extensions depends on plugin-sdk + ai + agent, so both land before
# tools/harness (which are independent of them but published in family order).
#
# Usage:
#   task              # list targets
#   task dry-run      # cargo publish --dry-run per crate, dep-ordered (no upload)
#   task publish      # real publish to crates.io, dep-ordered, with pre-flight test
#   task publish:fast # real publish, skip pre-flight tests (only after a green `task test`)
#   task test         # cargo test --workspace
#
# Prerequisite for `task publish*`: run `cargo login` once so ~/.cargo/credentials.toml
# exists with a valid publish-scoped token. crates.io records are permanent.

version: '3'

tasks:
  default:
    desc: List available release targets
    cmds:
      - task --list

  dry-run:
    desc: cargo publish --dry-run per crate, dep-ordered (no upload)
    cmds:
      - cargo publish --dry-run -p rpi-telemetry
      - cargo publish --dry-run -p rpi-ai
      - cargo publish --dry-run -p rpi-agent
      - cargo publish --dry-run -p rpi-plugin-sdk
      - cargo publish --dry-run -p rpi-extensions
      - cargo publish --dry-run -p rpi-tools
      - cargo publish --dry-run -p rpi-harness
      - cargo publish --dry-run -p rpi-tui
      - cargo publish --dry-run -p rpi-cli

  publish:
    desc: Real publish rpi-* crates to crates.io in dependency order (runs pre-flight `cargo test`)
    cmds:
      - cargo test --workspace
      - cargo publish -p rpi-telemetry
      - cargo publish -p rpi-ai
      - cargo publish -p rpi-agent
      - cargo publish -p rpi-plugin-sdk
      - cargo publish -p rpi-extensions
      - cargo publish -p rpi-tools
      - cargo publish -p rpi-harness
      - cargo publish -p rpi-tui
      - cargo publish -p rpi-cli

  publish:fast:
    desc: Real publish, dep-ordered, skip pre-flight tests (use only after a fresh green `task test`)
    cmds:
      - cargo publish -p rpi-telemetry
      - cargo publish -p rpi-ai
      - cargo publish -p rpi-agent
      - cargo publish -p rpi-plugin-sdk
      - cargo publish -p rpi-extensions
      - cargo publish -p rpi-tools
      - cargo publish -p rpi-harness
      - cargo publish -p rpi-tui
      - cargo publish -p rpi-cli

  test:
    desc: cargo test --workspace (the release pre-flight, run standalone)
    cmds:
      - cargo test --workspace
