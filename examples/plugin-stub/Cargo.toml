[package]
name = "plugin-stub"
version = "0.1.9"
edition = "2021"
publish = false
description = "Minimal rpi Rust-cdylib plugin: registers an `echo` tool + one event handler (the Part B2 ABI smoke target)."

[lib]
# cdylib so the host can load it via libloading as rpi_plugin_register.
crate-type = ["cdylib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
serde_json = { workspace = true }
