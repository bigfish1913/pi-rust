[package]
name = "rpi-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust-native (cdylib) plugin loader + AgentTool adapter for rpi — libloading + spawn_blocking ABI bridge"
readme = "../../README.md"
keywords = ["agent", "llm", "ai", "plugin", "ffi"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
rpi-ai = { workspace = true }
rpi-agent = { workspace = true }
libloading = "0.8"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[features]
default = []
