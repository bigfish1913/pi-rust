[package]
name = "rpi-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rpi-cli"
description = "Terminal coding-agent CLI (the `rpi` binary) built on the rpi-* library crates — a Rust port of @earendil-works/pi-coding-agent's CLI surface"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "cli"]
categories = [
    "command-line-interface",
    "api-bindings",
    "development-tools",
    "artificial-intelligence",
]

[dependencies]
rpi-telemetry = { workspace = true }
rpi-ai = { workspace = true, features = ["providers"] }
rpi-agent = { workspace = true }
rpi-tools = { workspace = true }
rpi-harness = { workspace = true }
rpi-tui = { workspace = true }
rpi-plugin-sdk = { workspace = true }
rpi-extensions = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std", "net"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
rpassword = { workspace = true }
tempfile = { workspace = true }
crossterm = { version = "0.27", features = ["events"] }
base64 = { workspace = true }
png = { workspace = true }
# arboard 3.x does not build on Android/Termux (no `Clipboard` in `platform`).
# Gate the dep to non-Android targets so `cargo install` on Termux still works;
# the `clipboard` feature becomes a harmless no-op there.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["clipboard"]
# Enables real clipboard support for `/copy` and image paste (best-effort).
clipboard = ["dep:arboard"]

[dev-dependencies]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rpi"
path = "src/bin/pi.rs"
