[package]
name = "pi-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Terminal coding-agent CLI built on the pi-rust library crates — a Rust port of @earendil-works/pi-coding-agent's CLI surface"
readme = "../../README.md"
keywords = ["agent", "llm", "ai", "claude", "cli"]
categories = ["command-line-interface", "api-bindings", "development-tools"]

[dependencies]
pi-telemetry = { workspace = true }
pi-ai = { workspace = true, features = ["providers"] }
pi-agent = { workspace = true }
pi-tools = { workspace = true }
pi-harness = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "pi"
path = "src/bin/pi.rs"
