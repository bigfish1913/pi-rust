[package]
name = "rpi-ai"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified multi-provider LLM types + streaming, Rust port of pi-ai"
readme = "../../README.md"
keywords = ["agent", "llm", "ai", "claude", "anthropic"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
rpi-telemetry = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

[features]
default = []
# Real HTTP providers (anthropic). Off by default so core builds remain network-free.
providers = ["dep:reqwest", "dep:bytes", "dep:eventsource-stream"]
# Live network smoke test, gated further by the ANTHROPIC_API_KEY env var at runtime.
smoke = ["providers"]
