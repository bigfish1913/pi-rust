[package]
name = "pi-tools"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Built-in agent tools (read/write/edit/bash/grep/find/ls) + ExecutionEnv, port of pi harness tools"
readme = "../../README.md"
keywords = ["agent", "llm", "ai", "claude", "tools"]
categories = ["api-bindings", "asynchronous", "development-tools"]

[dependencies]
pi-agent = { workspace = true }
pi-ai = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

# M4: path resolution, diff/patch, fuzzy-match normalization, shell detection
dirs = "5"
similar = { version = "2", features = ["text"] }
unicode-normalization = "0.1"
regex = { workspace = true }
globset = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[dev-dependencies]
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
