name: README image refresh

on:
  schedule:
    # 00:17 UTC+8 each day; GitHub may delay scheduled jobs.
    - cron: '17 16 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - README.md
      - scripts/refresh-readme-images.py
      - scripts/test_refresh_readme_images.py
      - .github/workflows/readme-images.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test README image refresh offline
        run: python -B -m unittest discover -s scripts -p test_refresh_readme_images.py -v

  refresh:
    needs: test
    if: >-
      github.repository == 'bigfish1913/pi-rust' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: readme-image-refresh-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh the WeChat image date
        run: python -B scripts/refresh-readme-images.py
      - name: Commit only when the date changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: refresh WeChat group image cache key [skip ci]'
          git push origin HEAD:main
