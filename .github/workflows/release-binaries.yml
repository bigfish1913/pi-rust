name: Release binaries

# Builds prebuilt `rpi` binaries and attaches them to the GitHub Release for a
# tag. This is what makes `curl -fsSL .../install.sh | sh` work and what removes
# the "you need a Rust toolchain and a C linker" barrier to trying the CLI.
#
# Main CI calls release.yml after tests; that workflow publishes crates.io
# and calls this workflow directly once the Release PR's tag is ready.

on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        type: string
      version:
        description: Full package version (used by preview releases)
        required: false
        type: string
        default: ''
      preview:
        description: Publish a GitHub prerelease without install channels
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: Commit or ref to build when the release tag is synthetic
        required: false
        type: string
        default: ''
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # musl-tools installs `musl-gcc`, while cc-rs derives the target-prefixed
  # compiler name unless this target-specific override is explicit.
  CC_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  # Release binaries must be built with the same warning policy as CI tests.
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    if: github.repository == 'bigfish1913/pi-rust'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          # GitHub-hosted arm64 Linux runners; available for public repos.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install manifest tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "${version}" ]]; then
            version="$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r '.packages[] | select(.name == "rpi-cli") | .version' | head -n 1)"
          fi
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not determine the rpi-cli workspace version." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building rpi ${version} for ${{ matrix.target }}"

      - name: Build release binary
        shell: bash
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [[ "${PREVIEW}" == "true" ]]; then
            RPI_BUILD_VERSION="${PREVIEW_VERSION}" cargo build -p rpi-cli --release --locked --target ${{ matrix.target }}
          else
            cargo build -p rpi-cli --release --locked --target ${{ matrix.target }}
          fi

      # --version bypasses resource leases/harness initialization. Exercise the
      # actual candidate on every native runner before staging any release asset.
      - name: Smoke test native startup and resource link boundaries
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            binary="target/${{ matrix.target }}/release/rpi.exe"
          else
            binary="target/${{ matrix.target }}/release/rpi"
          fi
          python -B scripts/test_resource_lease_startup_smoke.py
          python -B scripts/resource-lease-startup-smoke.py --rpi "$binary"

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="rpi-v${version}-${target}"
          mkdir -p dist

          if [[ "${target}" == *windows* ]]; then
            bin="target/${target}/release/rpi.exe"
          else
            bin="target/${target}/release/rpi"
          fi

          if [[ ! -f "${bin}" ]]; then
            echo "expected binary at ${bin} but it is missing" >&2
            exit 1
          fi

          cp "${bin}" dist/
          cp LICENSE dist/ 2>/dev/null || true
          cp NOTICE dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "../${name}.zip" . >/dev/null)
            asset="${name}.zip"
          else
            tar -czf "${name}.tar.gz" -C dist .
            asset="${name}.tar.gz"
          fi

          # Publish a checksum next to every archive so install.sh can verify it.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi

          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${asset}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Describe verified prebuilt distribution
        shell: bash
        run: |
          python scripts/prebuilt-release.py describe \
            --archive "${{ steps.stage.outputs.asset }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$(git rev-parse HEAD)" \
            --output "${{ steps.stage.outputs.asset }}.prebuilt.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.stage.outputs.asset }}
            ${{ steps.stage.outputs.checksum }}
            ${{ steps.stage.outputs.asset }}.prebuilt.json
          if-no-files-found: error
          overwrite: true

  release:
    name: Attach binaries to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install manifest tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: List artifacts
        run: ls -la dist

      - name: Verify all targets and assemble CLI manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/prebuilt-release.py assemble --directory dist \
            --tag "${TAG}" --commit "$(git rev-parse HEAD)" --output rpi-release.json

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/*.sha256)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Discovery must not advertise archives while they are being replaced.
            if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx rpi-release.json; then
              gh release delete-asset "${TAG}" rpi-release.json --yes
            fi
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            if [[ "${{ inputs.preview }}" == "true" ]]; then
              gh release create "${TAG}" "${assets[@]}" \
                --title "rpi ${TAG} (preview)" \
                --prerelease --generate-notes
            else
              gh release create "${TAG}" "${assets[@]}" \
                --title "rpi ${TAG}" \
                --generate-notes
            fi
          fi
          # Upload last: a manifest means all six verified archives are ready.
          gh release upload "${TAG}" rpi-release.json --clobber

  channels:
    if: inputs.preview != true
    needs: release
    uses: ./.github/workflows/release-channels.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
