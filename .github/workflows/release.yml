name: Release automation

on:
  workflow_call:
    inputs:
      prepare:
        description: 'Allow this run to prepare or update the stable Release PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    if: github.repository == 'bigfish1913/pi-rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-automation.py detect

  prepare:
    name: Prepare the next Release PR
    needs: detect
    if: needs.detect.outputs.release == 'false' && inputs.prepare == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-pr-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the automation token
        env:
          AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo '::error::Set RELEASE_AUTOMATION_TOKEN; see docs/maintaining/releasing.md.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Return the existing Release PR to draft before updating it
        id: draft-release-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: python3 scripts/release-automation.py draft-release-prs
      - name: Prepare versions and changelog
        id: release-pr
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
          version: '0.3.172'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Sync embedded docs and mark the Release PR ready
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_PR_JSON: ${{ steps.release-pr.outputs.pr }}
          EXISTING_RELEASE_PR_JSON: ${{ steps.draft-release-pr.outputs.pr }}
        run: bash scripts/sync-release-pr.sh

  publish:
    name: Publish crates and tag the tested Release PR
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Validate and publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN || secrets.CARGO_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo '::error::Missing CARGO_REGISTRY_TOKEN'; exit 1; }
          rustc --edition=2021 release-helper.rs -o .git/rpi-release-helper
          .git/rpi-release-helper validate "$VERSION"
          .git/rpi-release-helper publish "$VERSION"
      - name: Create the tag without moving existing tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-automation.py tag

  binaries:
    needs: [detect, publish]
    # Call directly: tags created using GITHUB_TOKEN do not trigger push workflows.
    uses: ./.github/workflows/release-binaries.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.detect.outputs.tag }}
    secrets: inherit
