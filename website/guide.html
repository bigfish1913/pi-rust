    <style>
      .guide-page { background: var(--paper); }
      .guide-hero {
        padding-top: clamp(90px, 12vw, 155px);
        padding-bottom: clamp(35px, 5vw, 60px);
        border-bottom: 1px solid var(--line);
      }
      .guide-hero h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1.05;
        letter-spacing: -.06em;
        font-weight: 800;
      }
      .guide-hero > p {
        max-width: 610px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
      }
      .guide-selector {
        display: flex;
        gap: 8px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .guide-selector button {
        padding: 8px 16px;
        border: 1px solid var(--line);
        background: var(--white);
        font: 11px var(--mono);
        font-weight: 500;
        letter-spacing: .02em;
        cursor: pointer;
        transition: all .2s;
      }
      .guide-selector button:hover {
        border-color: var(--orange);
        color: var(--orange-deep);
      }
      .guide-selector button.is-active {
        background: var(--ink);
        color: var(--white);
        border-color: var(--ink);
      }
      .guide-workspace {
        padding-top: clamp(40px, 6vw, 70px);
        padding-bottom: clamp(80px, 10vw, 130px);
      }
      .guide-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: clamp(30px, 5vw, 60px);
        align-items: start;
      }
      .guide-toc {
        position: sticky;
        top: 100px;
        max-height: calc(100vh - 140px);
        overflow-y: auto;
        padding-right: 12px;
      }
      .guide-toc-label {
        display: block;
        margin-bottom: 14px;
        color: var(--muted);
        font: 9px var(--mono);
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .guide-toc nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .guide-toc a {
        display: block;
        padding: 6px 10px;
        color: var(--muted);
        font: 11px var(--mono);
        text-decoration: none;
        border-left: 2px solid transparent;
        transition: all .15s;
        line-height: 1.5;
      }
      .guide-toc a:hover {
        color: var(--ink);
        border-left-color: var(--line);
      }
      .guide-toc a.is-active {
        color: var(--orange-deep);
        border-left-color: var(--orange);
      }
      .guide-toc a.level-3 {
        padding-left: 22px;
        font-size: 10px;
      }
      .guide-content {
        min-width: 0;
      }
      .guide-body {
        color: #464844;
        font-size: 13px;
        line-height: 1.9;
        max-width: 760px;
      }
      .guide-body p {
        margin: 0 0 14px;
      }
      .guide-body h1 {
        margin: 40px 0 16px;
        font-size: 32px;
        letter-spacing: -.05em;
        font-weight: 800;
      }
      .guide-body h2 {
        margin: 48px 0 14px;
        font-size: 24px;
        letter-spacing: -.04em;
        font-weight: 700;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      .guide-body h3 {
        margin: 36px 0 12px;
        font-size: 18px;
        letter-spacing: -.04em;
        font-weight: 700;
      }
      .guide-body h4 {
        margin: 28px 0 10px;
        font-size: 15px;
        letter-spacing: -.03em;
        font-weight: 700;
      }
      .guide-body code {
        padding: 2px 6px;
        background: var(--paper);
        color: var(--orange-deep);
        font: 11px var(--mono);
        border-radius: 2px;
      }
      .guide-body pre {
        margin: 20px 0;
        padding: 18px 20px;
        background: var(--ink);
        color: #d7dcd0;
        overflow: auto;
        border-radius: 0;
      }
      .guide-body pre code {
        padding: 0;
        background: transparent;
        color: inherit;
        font: 11px/1.8 var(--mono);
      }
      .guide-body ul, .guide-body ol {
        margin: 0 0 14px;
        padding-left: 22px;
      }
      .guide-body li {
        margin-bottom: 6px;
        color: #464844;
        font-size: 13px;
        line-height: 1.75;
      }
      .guide-body strong {
        font-weight: 700;
        color: var(--ink);
      }
      .guide-body a {
        color: var(--orange-deep);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .guide-body a:hover {
        color: var(--orange);
      }
      .guide-body table {
        width: 100%;
        margin: 20px 0;
        border-collapse: collapse;
        font-size: 12px;
      }
      .guide-body th, .guide-body td {
        padding: 10px 12px;
        text-align: left;
        border: 1px solid var(--line);
      }
      .guide-body th {
        background: var(--paper);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: .02em;
      }
      .guide-body blockquote {
        margin: 20px 0;
        padding: 12px 20px;
        border-left: 3px solid var(--orange);
        background: var(--paper);
        color: var(--muted);
      }
      .guide-body blockquote p {
        margin: 0;
      }
      .guide-loading {
        padding: 60px 20px;
        text-align: center;
        color: var(--muted);
        font: 12px var(--mono);
      }
      .guide-error {
        padding: 60px 20px;
        text-align: center;
        color: var(--muted);
        font: 12px var(--mono);
        border: 1px dashed var(--line);
      }
      @media (max-width: 900px) {
        .guide-layout {
          grid-template-columns: 1fr;
        }
        .guide-toc {
          position: static;
          max-height: none;
          margin-bottom: 30px;
          padding-right: 0;
          border-bottom: 1px solid var(--line);
          padding-bottom: 20px;
        }
      }
    </style>
