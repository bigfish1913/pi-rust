# pi-rust — Rust port of the Pi agent SDK
# Workspace root. See README.md and docs/architecture.md.
[workspace]
members = [
    "crates/pi-telemetry",
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-tools",
    "crates/pi-harness",
    "crates/pi-cli",
    "crates/pi-tui",
    "crates/rpi-plugin-sdk",
    "crates/rpi-extensions",
    "examples/minimal",
    "examples/tools",
    "examples/tui",
    "examples/plugin-stub",
]
default-members = [
    "crates/pi-agent",
    "crates/pi-tools",
    "crates/pi-harness",
    "crates/pi-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/bigfish193/pi-rust"
version = "0.1.4"
authors = ["BigFish <bigfish1913@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# Serialization / schemas
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
schemars = { version = "0.8", features = ["preserve_order"] }
jsonschema = "0.18"

# HTTP / SSE (used by anthropic provider, M3)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
eventsource-stream = "0.2"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Misc
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
tempfile = "3"
regex = "1"
globset = "0.4"
dirs = "5"
rpassword = "7"

# pi-rust internal crates (published under the `rpi-` prefix; directories keep
# the `pi-` name — package `name` is what crates.io + `extern crate` see).
rpi-telemetry = { path = "crates/pi-telemetry", version = "0.1.4" }
rpi-ai = { path = "crates/pi-ai", version = "0.1.4" }
rpi-agent = { path = "crates/pi-agent", version = "0.1.4" }
rpi-tools = { path = "crates/pi-tools", version = "0.1.4" }
rpi-harness = { path = "crates/pi-harness", version = "0.1.4" }

rpi-tui = { path = "crates/pi-tui", version = "0.1.4" }

rpi-plugin-sdk = { path = "crates/rpi-plugin-sdk", version = "0.1.4" }
rpi-extensions = { path = "crates/rpi-extensions", version = "0.1.4" }

[profile.release]
lto = "thin"
codegen-units = 16
