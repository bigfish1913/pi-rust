# Contributors do not bump versions. Release-plz prepares one workspace PR;
# the scheduled release workflow requests Auto-merge after validation, and
# release.yml publishes it only after that PR merges into main.
[workspace]
release = false
release_always = false
dependencies_update = false
changelog_update = false
git_tag_enable = false
git_release_enable = false
pr_branch_prefix = "release-plz-"
pr_name = "chore(release): prepare {{ version }}"
pr_draft = true

[[package]]
name = "rpi-telemetry"
release = true
version_group = "rpi"

[[package]]
name = "rpi-ai"
release = true
version_group = "rpi"

[[package]]
name = "rpi-runtime"
release = true
version_group = "rpi"

[[package]]
name = "rpi-agent"
release = true
version_group = "rpi"

[[package]]
name = "rpi-plugin-sdk"
release = true
version_group = "rpi"

[[package]]
name = "rpi-extensions"
release = true
version_group = "rpi"

[[package]]
name = "rpi-tools"
release = true
version_group = "rpi"

[[package]]
name = "rpi-durable"
release = true
version_group = "rpi"

[[package]]
name = "rpi-harness"
release = true
version_group = "rpi"

[[package]]
name = "rpi-tui"
release = true
version_group = "rpi"

[[package]]
name = "rpi-cli"
release = true
version_group = "rpi"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["rpi-telemetry", "rpi-ai", "rpi-runtime", "rpi-agent", "rpi-plugin-sdk", "rpi-extensions", "rpi-tools", "rpi-durable", "rpi-harness", "rpi-tui"]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
